<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand" role="button" onclick="location.hash='#/posts'">🪶 Kestrel</div>
  <nav>
    <a href="#/posts">Posts</a>
    <a href="#/status">Status</a>
  </nav>
  <button id="tokenBtn" class="ghost" title="Set access token">🔑</button>
</header>

<div id="tokenBanner" class="banner" hidden>
  <span>Paste your admin token to connect.</span>
  <input id="tokenInput" type="password" placeholder="Bearer token" autocomplete="off">
  <button id="tokenSave">Connect</button>
</div>

<main id="app" class="container"></main>

<script src="./app.js"></script>
</body>
</html>
