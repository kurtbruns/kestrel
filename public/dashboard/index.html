<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="./styles.css?v=f88588ce">
<script>
// Sidebar mode guard — set the width-based data-nav on <html> before first paint so the
// sidebar renders in its final width with no flash. The collapse toggle's override is
// session-only (in-memory in app.js), so a fresh load always starts from this default;
// keep this width formula in sync with computeNavMode() in app.js.
(() => {
  const w = window.innerWidth;
  const mode = w < 540 || w > 1024 ? "full" : "rail";
  document.documentElement.dataset.nav = mode;
})();
</script>
</head>
<body>
<!-- Sidebar icon sprite. The primary nav shows icon + label at full width; in the
     collapsed icon rail (the first step down from the full sidebar) the labels fold
     to hover tooltips and only these marks remain. Kept out of flow and hidden from
     assistive tech. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-dash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-drafts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-subs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M4 20c0-3 2.2-5 5-5s5 2 5 5"/><path d="M16 15c2 0 4 1.6 4 5"/></symbol>
    <symbol id="i-sent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 11 14M22 3l-7 18-4-7-7-4 18-7z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-template" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15h18"/></symbol>
    <symbol id="i-view" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></symbol>
    <symbol id="i-signout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5l-7.5 7.5 7.5 7.5"/></symbol>
  </defs>
</svg>
<!-- Mobile only: a hamburger that slides the publication sidebar in as a drawer
     (no bottom tabs). Hidden on desktop and inside the editor / reference room. -->
<button type="button" class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
  <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
</button>
<div class="nav-scrim" id="navScrim" hidden></div>
<!-- Publication workspace: a left sidebar (brand → Dashboard, primary nav, account,
     tool footer) beside the routed view. The editor route hides the sidebar for a
     full-width writing canvas (body.editor-mode); the reference room (Overview/Docs/
     API) hides it too and renders its own top bar (body.tool-mode). Admin→public
     links are fine (View publication ↗); the reverse is never emitted (SPEC §10). -->
<div class="layout">
  <aside class="sidebar" aria-label="Publication">
    <!-- The column stretches to the full page height (its background + divider run all
         the way down); this inner wrapper is the sticky, viewport-tall part that pins
         the nav as you scroll, so the column never ends short of the viewport. -->
    <div class="sidebar-inner">
    <div class="sidebar-top">
      <a class="brand" href="#/dashboard" id="brandLink" aria-label="Dashboard — publication home">
        <span class="brand-logo" id="brandLogo" aria-hidden="true"></span>
        <span class="brand-meta">
          <span class="brand-name" id="brandName">Kestrel</span>
          <span class="brand-tagline" id="brandTagline" hidden></span>
        </span>
      </a>
      <a class="view-pub" id="viewPub" href="/" target="_blank" rel="noopener" title="View publication">
        <svg class="view-pub-icon" aria-hidden="true"><use href="#i-view"/></svg>
        <span class="view-pub-label">View publication&nbsp;↗</span>
      </a>
      <nav class="nav-primary" aria-label="Primary">
        <a href="#/dashboard" data-view="dashboard"><svg class="nav-icon" aria-hidden="true"><use href="#i-dash"/></svg><span class="nav-label">Dashboard</span></a>
        <a href="#/drafts" data-view="drafts"><svg class="nav-icon" aria-hidden="true"><use href="#i-drafts"/></svg><span class="nav-label">Drafts</span></a>
        <a href="#/sent" data-view="sent"><svg class="nav-icon" aria-hidden="true"><use href="#i-sent"/></svg><span class="nav-label">Sent</span></a>
        <a href="#/subscribers" data-view="subscribers"><svg class="nav-icon" aria-hidden="true"><use href="#i-subs"/></svg><span class="nav-label">Subscribers</span></a>
        <a href="#/template" data-view="template"><svg class="nav-icon" aria-hidden="true"><use href="#i-template"/></svg><span class="nav-label">Template</span></a>
        <a href="#/settings" data-view="settings"><svg class="nav-icon" aria-hidden="true"><use href="#i-settings"/></svg><span class="nav-label">Settings</span></a>
      </nav>
    </div>
    <div class="sidebar-foot">
      <div id="identity" class="identity" role="status" aria-label="Signed-in identity"></div>
      <div class="tool-foot">
        <a class="powered" href="#/start" title="Getting started with Kestrel">
          <svg class="kestrel-mark" viewBox="0 0 360 360" aria-hidden="true"><path d="M290.028 216.064C285.698 218.264 280.838 219.394 275.978 219.344C281.268 225.044 284.128 232.924 283.708 240.694C283.278 248.844 279.388 256.514 274.268 262.874C269.148 269.244 262.808 274.494 256.608 279.814C237.148 296.474 218.248 314.404 195.328 325.854C178.568 334.224 160.148 338.864 143.458 347.374C140.148 349.064 136.898 350.904 133.418 352.224C129.938 353.544 126.178 354.324 122.498 353.794C121.718 353.684 120.938 353.504 120.228 353.184C119.508 352.864 118.848 352.374 118.408 351.734C117.918 351.024 117.708 350.154 117.718 349.304C117.728 348.454 117.948 347.614 118.268 346.824C118.567 346.054 118.967 345.339 119.371 344.618L119.418 344.534C128.788 327.894 140.118 312.454 150.358 296.344C160.598 280.224 169.848 263.174 174.428 244.634C176.258 237.264 177.328 229.644 176.738 222.074C176.138 214.504 173.808 206.964 169.308 200.854C164.588 194.434 157.728 189.874 150.538 186.434C139.628 181.204 127.768 178.284 115.858 176.154C93.9183 172.224 71.6083 170.884 49.4083 168.944C45.8483 168.634 42.2483 168.294 38.8783 167.124C34.7683 165.704 31.0683 163.004 28.7383 159.334C26.4183 155.664 25.5583 151.024 26.7483 146.844C27.6583 143.624 29.7283 140.784 32.3583 138.724C34.9883 136.654 38.1683 135.324 41.4383 134.634C44.7183 133.944 48.0983 133.874 51.4383 134.154C53.2683 134.304 55.0883 134.554 56.8983 134.824C72.2383 137.094 87.3783 140.484 102.548 143.644C115.468 146.334 128.498 148.864 141.688 149.224C154.878 149.574 168.338 147.654 180.178 141.824C196.548 133.764 208.758 118.514 215.298 101.474C224.258 78.094 223.028 52.174 220.398 27.284C219.788 21.484 219.108 15.614 220.058 9.854C220.178 9.124 220.328 8.38398 220.658 7.71398C220.988 7.05398 221.528 6.45399 222.228 6.19399C222.858 5.95399 223.568 6.01399 224.218 6.22399C224.858 6.43399 225.448 6.77399 226.028 7.12399C262.588 29.154 290.508 63.614 310.198 101.484C312.188 105.314 314.108 109.204 315.408 113.314C316.708 117.434 317.           <span>Kestrel</span>
        </a>
        <nav class="nav-tools" aria-label="Tools">
          <a href="#/docs" data-view="docs" data-text="Docs">Docs</a>
          <a href="#/reference" data-view="reference" data-text="API">API</a>
        </nav>
        <!-- Collapse ↔ expand, tucked into the end of the footer row (chevron
             right-aligned). Flips <html data-nav> and persists the choice; hidden on
             phones, where the sidebar is an off-canvas overlay. -->
        <button type="button" class="nav-collapse" id="navCollapse" aria-label="Collapse sidebar" aria-expanded="true">
          <svg class="nav-collapse-icon" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </div>
    </div>
  </aside>
  <main id="app" class="content"></main>
</div>
<!-- Shared unsaved-changes bar: one full-width banner fixed to the bottom of the
     viewport, offset past the sidebar on desktop and edge-to-edge once the sidebar
     is the off-canvas drawer. Every surface with an explicit save + a revertible
     baseline (Settings, the Template page) drives it through the savebar controller
     in app.js; route() detaches it on each navigation. The post editor keeps its own
     autosave + conflict model and deliberately does not use this. -->
<section class="savebar" id="savebar" aria-label="Unsaved changes" aria-live="polite" hidden>
  <div class="savebar-inner">
    <span class="savebar-msg"></span>
    <span class="savebar-acts">
      <button type="button" id="savebarDiscard">Discard</button>
      <button type="button" class="primary" id="savebarSave">Save changes</button>
    </span>
  </div>
</section>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="./app.js?v=76b87074"></script>
</body>
</html>
