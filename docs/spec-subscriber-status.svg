<svg xmlns="http://www.w3.org/2000/svg" width="898" height="424" viewBox="0 0 898 424" role="img" aria-labelledby="title desc">
  <title id="title">How a subscriber's status moves</title>
  <desc id="desc">The four states an address can be in (no subscriber, pending, confirmed, unsubscribed) and the moves between them, each labeled with who makes it, as the table below lists. Imports are not drawn.</desc>
  <style>
    .n-none rect { fill: #ffffff; stroke: #8792a2; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .n-pending rect { fill: #fef3c7; stroke: #f2c94c; stroke-width: 1.5; }
    .n-confirmed rect { fill: #dcfce7; stroke: #86d9a3; stroke-width: 1.5; }
    .n-unsub rect { fill: #f4f4f5; stroke: #c4c4cc; stroke-width: 1.5; }
    .ntitle { font: 600 16.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
    .n-pending .ntitle { fill: #b45309; } .n-confirmed .ntitle { fill: #15803d; } .n-unsub .ntitle { fill: #52525b; }
    .nsub { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5a6273; }
    .lbl { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a-reader { fill: #2453c7; } .a-publisher { fill: #7a3fb8; } .a-import { fill: #0f7a5a; } .a-provider { fill: #c2410c; } .a-time { fill: #5a6273; }
    .a-who { fill: #5a6273; font-weight: 500; font-style: italic; }
    .e { stroke: #5a6273; stroke-width: 1.6; fill: none; }
    .ahead { fill: #5a6273; }
    @media (prefers-color-scheme: dark) {
      .n-none rect { fill: #191e27; stroke: #6b7586; }
      .n-pending rect { fill: #45350f; stroke: #b45309; } .n-pending .ntitle { fill: #fbbf24; }
      .n-confirmed rect { fill: #14532d; stroke: #15803d; } .n-confirmed .ntitle { fill: #4ade80; }
      .n-unsub rect { fill: #27272a; stroke: #52525b; } .n-unsub .ntitle { fill: #c4c4cc; }
      .ntitle { fill: #e3e7ee; }
      .n-pending .ntitle { fill: #fbbf24; } .n-confirmed .ntitle { fill: #4ade80; } .n-unsub .ntitle { fill: #c4c4cc; } .nsub, .a-time, .a-who { fill: #9aa3b4; }
      .a-reader { fill: #7d9bff; } .a-publisher { fill: #c4a5f0; } .a-import { fill: #34d399; } .a-provider { fill: #fb923c; }
      .e { stroke: #9aa3b4; } .ahead { fill: #9aa3b4; }
    }
  </style>

<defs><marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" class="ahead"/></marker><marker id="ss-c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" class="ahead"/></marker></defs>
<path class="e" d="M182,110 H313" marker-end="url(#ss-a)"/>
<path class="e" d="M488,110 H619" marker-end="url(#ss-a)"/>
<path class="e" d="M376,80 C356,22 448,22 428,77" marker-end="url(#ss-a)"/>
<path class="e" d="M708,140 V306 Q708,320 694,320 H491" marker-end="url(#ss-a)"/>
<path class="e" d="M432,140 V287" marker-end="url(#ss-a)"/>
<path class="e" d="M372,290 V143" marker-end="url(#ss-a)"/>
<path class="e" d="M376,350 C356,408 448,408 428,353" marker-end="url(#ss-a)"/>
<g class="node n-none"><rect x="10" y="80" width="172" height="60" rx="14"/><text class="ntitle" x="96" y="108" text-anchor="middle">No subscriber</text><text class="nsub" x="96" y="127" text-anchor="middle">unknown address</text></g>
<g class="node n-pending"><rect x="316" y="80" width="172" height="60" rx="14"/><text class="ntitle" x="402" y="108" text-anchor="middle">pending</text><text class="nsub" x="402" y="127" text-anchor="middle">gets its confirmation only</text></g>
<g class="node n-confirmed"><rect x="622" y="80" width="172" height="60" rx="14"/><text class="ntitle" x="708" y="108" text-anchor="middle">confirmed</text><text class="nsub" x="708" y="127" text-anchor="middle">gets posts</text></g>
<g class="node n-unsub"><rect x="316" y="290" width="172" height="60" rx="14"/><text class="ntitle" x="402" y="318" text-anchor="middle">unsubscribed</text><text class="nsub" x="402" y="337" text-anchor="middle">keeps why they left</text></g>
<text class="lbl a-reader" x="249" y="82" text-anchor="middle">reader subscribes</text>
<text class="lbl a-publisher" x="249" y="100" text-anchor="middle">publisher adds</text>
<text class="lbl a-reader" x="555" y="82" text-anchor="middle">reader confirms</text>
<text class="lbl a-time" x="452" y="50" text-anchor="start">link expires</text>
<text class="lbl a-reader" x="360" y="206" text-anchor="end">reader subscribes again</text>
<text class="lbl a-publisher" x="360" y="224" text-anchor="end">publisher adds</text>
<text class="lbl a-reader" x="444" y="188" text-anchor="start">reader unsubscribes</text>
<text class="lbl a-reader" x="444" y="206" text-anchor="start">reader reports spam</text>
<text class="lbl a-publisher" x="444" y="224" text-anchor="start">publisher unsubscribes</text>
<text class="lbl a-publisher" x="444" y="242" text-anchor="start">publisher erases</text>
<text class="lbl a-reader" x="720" y="179" text-anchor="start">reader unsubscribes</text>
<text class="lbl a-reader" x="720" y="197" text-anchor="start">reader reports spam</text>
<text class="lbl a-publisher" x="720" y="215" text-anchor="start">publisher unsubscribes</text>
<text class="lbl a-publisher" x="720" y="233" text-anchor="start">publisher erases</text>
<text class="lbl a-publisher" x="452" y="388" text-anchor="start">publisher erases</text>
</svg>