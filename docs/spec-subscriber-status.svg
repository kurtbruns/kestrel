<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 423" role="img" aria-labelledby="title desc">
  <title id="title">How a subscriber's status moves</title>
  <desc id="desc">No subscriber, pending and confirmed sit in a row, with unsubscribed below pending. The reader subscribing, or the publisher adding the address, makes it pending, and the reader pressing Confirm makes it confirmed; a confirmation link that expires changes nothing. A pending or confirmed subscriber becomes unsubscribed by their own unsubscribe link, the publisher's Unsubscribe on their request, a complaint about the mail, or the publisher's Erase, and Erase also strips the record of someone already unsubscribed. An unsubscribed person returns to pending by subscribing again, or by the publisher adding them, unless they left by a complaint or an erasure. Imports are not drawn.</desc>
  <style>
    .n-none rect { fill: #ffffff; stroke: #8792a2; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .n-pending rect { fill: #fef3c7; stroke: #f2c94c; stroke-width: 1.5; }
    .n-confirmed rect { fill: #dcfce7; stroke: #86d9a3; stroke-width: 1.5; }
    .n-unsub rect { fill: #f4f4f5; stroke: #c4c4cc; stroke-width: 1.5; }
    .ntitle { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
    .n-pending .ntitle { fill: #b45309; } .n-confirmed .ntitle { fill: #15803d; } .n-unsub .ntitle { fill: #52525b; }
    .nsub { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5a6273; }
    .lbl { font: 600 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .a-reader { fill: #2453c7; } .a-publisher { fill: #7a3fb8; } .a-import { fill: #0f7a5a; } .a-provider { fill: #c2410c; } .a-time { fill: #5a6273; }
    .a-who { fill: #5a6273; font-weight: 500; font-style: italic; }
    .e { stroke: #5a6273; stroke-width: 1.5; fill: none; }
    .ahead { fill: #5a6273; }
    @media (prefers-color-scheme: dark) {
      .n-none rect { fill: #191e27; stroke: #6b7586; }
      .n-pending rect { fill: #45350f; stroke: #b45309; } .n-pending .ntitle { fill: #fbbf24; }
      .n-confirmed rect { fill: #14532d; stroke: #15803d; } .n-confirmed .ntitle { fill: #4ade80; }
      .n-unsub rect { fill: #27272a; stroke: #52525b; } .n-unsub .ntitle { fill: #c4c4cc; }
      .ntitle { fill: #e3e7ee; }
      .n-pending .ntitle { fill: #fbbf24; } .n-confirmed .ntitle { fill: #4ade80; } .n-unsub .ntitle { fill: #c4c4cc; } .nsub, .a-time, .a-who { fill: #9aa3b4; }
      .a-reader { fill: #7d9bff; } .a-publisher { fill: #c4a5f0; } .a-import { fill: #34d399; } .a-provider { fill: #fb923c; }
      .e { stroke: #9aa3b4; } .ahead { fill: #9aa3b4; }
    }
  </style>

<defs><marker id="ss-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" class="ahead"/></marker><marker id="ss-c" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" class="ahead"/></marker></defs>
<path class="e" d="M190,110 H302" marker-end="url(#ss-a)"/>
<path class="e" d="M475,110 H587" marker-end="url(#ss-a)"/>
<path class="e" d="M364,81 C344,23 436,23 416,78" marker-end="url(#ss-a)"/>
<path class="e" d="M675,139 V306 Q675,320 661,320 H478" marker-end="url(#ss-a)"/>
<path class="e" d="M420,139 V288" marker-end="url(#ss-a)"/>
<path class="e" d="M360,291 V142" marker-end="url(#ss-a)"/>
<path class="e" d="M364,349 C344,407 436,407 416,352" marker-end="url(#ss-a)"/>
<g class="node n-none"><rect x="20" y="81" width="170" height="58" rx="14"/><text class="ntitle" x="105" y="108" text-anchor="middle">No subscriber</text><text class="nsub" x="105" y="125.5" text-anchor="middle">unknown address</text></g>
<g class="node n-pending"><rect x="305" y="81" width="170" height="58" rx="14"/><text class="ntitle" x="390" y="108" text-anchor="middle">pending</text><text class="nsub" x="390" y="125.5" text-anchor="middle">gets its confirmation only</text></g>
<g class="node n-confirmed"><rect x="590" y="81" width="170" height="58" rx="14"/><text class="ntitle" x="675" y="108" text-anchor="middle">confirmed</text><text class="nsub" x="675" y="125.5" text-anchor="middle">gets posts</text></g>
<g class="node n-unsub"><rect x="305" y="291" width="170" height="58" rx="14"/><text class="ntitle" x="390" y="318" text-anchor="middle">unsubscribed</text><text class="nsub" x="390" y="335.5" text-anchor="middle">keeps why they left</text></g>
<text class="lbl a-reader" x="247.5" y="84" text-anchor="middle">subscribes</text>
<text class="lbl a-publisher" x="247.5" y="100" text-anchor="middle">Add</text>
<text class="lbl a-reader" x="532.5" y="84" text-anchor="middle">Confirm</text>
<text class="lbl a-time" x="440" y="51" text-anchor="start">link expires</text>
<text class="lbl a-reader" x="348" y="207" text-anchor="end">subscribes again</text>
<text class="lbl a-publisher" x="348" y="223" text-anchor="end">Add</text>
<text class="lbl a-publisher" x="432" y="183" text-anchor="start">Unsubscribe</text>
<text class="lbl a-provider" x="432" y="199" text-anchor="start">complaint</text>
<text class="lbl a-publisher" x="432" y="215" text-anchor="start">Erase</text>
<text class="lbl a-reader" x="432" y="231" text-anchor="start">old post's link</text>
<text class="lbl a-reader" x="663" y="183" text-anchor="end">unsubscribes</text>
<text class="lbl a-publisher" x="663" y="199" text-anchor="end">Unsubscribe</text>
<text class="lbl a-provider" x="663" y="215" text-anchor="end">complaint</text>
<text class="lbl a-publisher" x="663" y="231" text-anchor="end">Erase</text>
<text class="lbl a-publisher" x="440" y="387" text-anchor="start">Erase</text>
</svg>