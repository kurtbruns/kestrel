<svg xmlns="http://www.w3.org/2000/svg" width="1055" height="362" viewBox="0 45 1055 362" role="img" aria-labelledby="title desc">
  <title id="title">Kestrel and the parties that reach it</title>
  <desc id="desc">The publisher drives the web editor and asks Claude; both reach Kestrel only through its authoring API, which reads and writes the database and object storage and hands email to the email provider. The provider delivers it to readers. Readers come back through the public pages (subscribe, confirm, unsubscribe, and the archive), which read the same store. The provider reports deliveries, bounces, and complaints through signed webhooks, which record them in the store without passing through the authoring API.</desc>
  <style>
    .box { fill: #ffffff; stroke: #b8c0cc; stroke-width: 1.5; }
    .app { fill: #f3f5f8; stroke: #8792a2; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .t { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1d2330; }
    .h { font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5a6273; letter-spacing: .08em; }
    .l { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5a6273; }
    .e { stroke: #5a6273; stroke-width: 1.5; fill: none; }
    .r { stroke: #3b5b8c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .ah { fill: #5a6273; }
    .ahr { fill: #3b5b8c; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #191e27; stroke: #4a5363; }
      .app { fill: #12161d; stroke: #6b7586; }
      .t { fill: #e3e7ee; }
      .h, .l { fill: #9aa3b4; }
      .e { stroke: #9aa3b4; }
      .r { stroke: #8fb0e3; }
      .ah { fill: #9aa3b4; }
      .ahr { fill: #8fb0e3; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahr"/></marker>
  </defs>

  <!-- Kestrel -->
  <rect x="300" y="60" width="390" height="332" rx="10" class="app"/>
  <text x="316" y="84" class="h">KESTREL</text>

  <!-- nodes -->
  <rect x="15" y="101" width="100" height="50" rx="25" class="box"/>
  <text x="65" y="131" text-anchor="middle" class="t">Publisher</text>
  <rect x="160" y="74" width="110" height="44" rx="6" class="box"/>
  <text x="215" y="101" text-anchor="middle" class="t">Web editor</text>
  <rect x="160" y="134" width="110" height="44" rx="6" class="box"/>
  <text x="215" y="161" text-anchor="middle" class="t">Claude</text>
  <rect x="320" y="100" width="130" height="52" rx="6" class="box"/>
  <text x="385" y="131" text-anchor="middle" class="t">Authoring API</text>
  <path d="M325,214 a60,10 0 0 1 120,0 v42 a60,10 0 0 1 -120,0 z" class="box"/>
  <path d="M325,214 a60,10 0 0 0 120,0" class="box" fill="none"/>
  <text x="385" y="240" text-anchor="middle" class="t">Database</text>
  <text x="385" y="255" text-anchor="middle" class="l">+ object storage</text>
  <rect x="515" y="214" width="130" height="52" rx="6" class="box"/>
  <text x="580" y="245" text-anchor="middle" class="t">Webhooks</text>
  <rect x="320" y="316" width="130" height="46" rx="6" class="box"/>
  <text x="385" y="344" text-anchor="middle" class="t">Public pages</text>
  <rect x="710" y="100" width="130" height="52" rx="6" class="box"/>
  <text x="775" y="131" text-anchor="middle" class="t">Email provider</text>
  <rect x="920" y="101" width="120" height="50" rx="25" class="box"/>
  <text x="980" y="131" text-anchor="middle" class="t">Reader</text>

  <!-- edges, drawn after the nodes so no box covers an arrowhead -->
  <line x1="113" y1="116" x2="155.7" y2="102.4" class="e" marker-end="url(#a)"/>
  <line x1="113" y1="136" x2="155.7" y2="149.6" class="e" marker-end="url(#a)"/>
  <line x1="270" y1="101" x2="315.7" y2="116.6" class="e" marker-end="url(#a)"/>
  <line x1="270" y1="151" x2="315.7" y2="135.4" class="e" marker-end="url(#a)"/>
  <line x1="450" y1="126" x2="705.5" y2="126" class="e" marker-end="url(#a)"/>
  <line x1="385" y1="152" x2="385" y2="199.5" class="e" marker-end="url(#a)"/>
  <line x1="515" y1="240" x2="449.5" y2="240" class="r" marker-end="url(#ar)"/>
  <line x1="385" y1="316" x2="385" y2="270.5" class="e" marker-end="url(#a)"/>
  <path d="M740,152 L740,240 L649.5,240" class="r" marker-end="url(#ar)"/>
  <line x1="840" y1="126" x2="915.5" y2="126" class="e" marker-end="url(#a)"/>
  <path d="M980,151 L980,339 L454.5,339" class="e" marker-end="url(#a)"/>

  <!-- labels -->
  <text x="104" y="92" class="l">drives</text>
  <text x="104" y="172" class="l">asks</text>
  <text x="580" y="118" text-anchor="middle" class="l">hands off email</text>
  <text x="393" y="183" class="l">reads, writes</text>
  <text x="480" y="232" text-anchor="middle" class="l">records</text>
  <text x="393" y="296" class="l">reads</text>
  <text x="748" y="180" class="l">deliveries, bounces,</text>
  <text x="748" y="196" class="l">complaints (signed)</text>
  <text x="880" y="118" text-anchor="middle" class="l">delivers</text>
  <text x="545" y="331" text-anchor="middle" class="l">subscribe, confirm,</text>
  <text x="545" y="355" text-anchor="middle" class="l">unsubscribe, archive</text>
</svg>
